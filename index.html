<style>
  :root {
    --ink: #1A2530;
    --ink-sub: #5B6B78;
    --paper: #FFFFFF;
    --mist: #F2F5F7;
    --line: #D9E1E6;
    --accent: #0B76A0;
    --on-accent: #FFFFFF;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #E6EDF2; --ink-sub: #9AABB8; --paper: #121A21; --mist: #1A242D;
      --line: #2C3A45; --accent: #4FB3DA; --on-accent: #0D1A22;
    }
  }
  :root[data-theme="dark"] {
    --ink: #E6EDF2; --ink-sub: #9AABB8; --paper: #121A21; --mist: #1A242D;
    --line: #2C3A45; --accent: #4FB3DA; --on-accent: #0D1A22;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 1rem;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 clamp(1rem, 4vw, 2.5rem); }

  /* 상단 소개 */
  .intro { padding: clamp(2.5rem, 6vw, 4rem) 0 0; }
  .brand { font-weight: 700; font-size: 0.95rem; color: var(--accent); margin: 0 0 1rem; }
  .intro h1 { font-size: clamp(1.75rem, 4vw, 2.5rem); line-height: 1.25; margin: 0 0 0.75rem; letter-spacing: -0.02em; }
  .intro p.lead { margin: 0; color: var(--ink-sub); max-width: 60ch; }

  /* 데모 그리드 (2 x 2) */
  #demos {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: clamp(1rem, 2.5vw, 1.75rem);
    padding-top: clamp(2rem, 4vw, 3rem);
    padding-bottom: clamp(2rem, 4vw, 3rem);
  }
  .demo {
    display: flex; flex-direction: column;
    border: 1px solid var(--line); border-radius: 12px;
    padding: 1.25rem; background: var(--paper);
  }
  .demo:hover { border-color: var(--accent); }
  .demo-head { display: grid; grid-template-columns: auto 1fr; gap: 0.75rem; align-items: start; margin-bottom: 1rem; }
  .demo-head .no {
    width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 0.875rem;
  }
  .demo-head h2 { font-size: 1.125rem; line-height: 1.4; margin: 0.1rem 0 0.2rem; letter-spacing: -0.01em; }
  .demo-head p { margin: 0; color: var(--ink-sub); font-size: 0.875rem; line-height: 1.55; }
  .demo .frame { margin-top: auto; }
  @media (max-width: 720px) {
    #demos { grid-template-columns: 1fr; }
  }

  .frame {
    position: relative; width: 100%; height: 0;
    padding-bottom: calc(var(--ratio, 56.25%) + var(--extra, 0px));
    background: var(--mist); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; color-scheme: light; }
  .frame iframe.is-popout { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 9999999; }
  .empty {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    padding: 2rem; color: var(--ink-sub); font-size: 0.9375rem;
  }

  footer { padding: 2rem 0 3rem; font-size: 0.8125rem; color: var(--ink-sub); }

  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>

    </div>

  <main class="wrap" id="demos"></main>

<script>
/* Arcade modal(팝아웃) 처리: 붙여넣은 코드의 스크립트를 대신해 페이지 전체에서 한 번만 등록 */
window.addEventListener("message", e => {
  if (e.origin !== "https://demo.arcade.software" || !e.isTrusted || !e.data || !e.data.id) return;
  const f = document.querySelector(`iframe[src*="${CSS.escape(e.data.id)}"]`);
  if (!f || !f.contentWindow) return;
  if (e.data.event === "arcade-init") f.contentWindow.postMessage({ event: "register-popout-handler" }, "*");
  if (e.data.event === "arcade-popout-open") f.classList.add("is-popout");
  if (e.data.event === "arcade-popout-close") f.classList.remove("is-popout");
});

/* 붙여넣은 Embed 코드에서 iframe 주소와 화면 비율 추출 */
function parseEmbed(tpl) {
  const iframe = tpl.content.querySelector("iframe");
  if (iframe && iframe.getAttribute("src")) {
    const box = (iframe.parentElement && iframe.parentElement.getAttribute("style")) || "";
    const m = box.match(/padding-bottom:\s*calc\(\s*([\d.]+%)\s*\+\s*([\d.]+px)\s*\)/) ||
              box.match(/padding-bottom:\s*([\d.]+%)/);
    return { src: iframe.getAttribute("src"), ratio: m ? m[1] : "56.25%", extra: m && m[2] ? m[2] : "0px" };
  }
  const text = tpl.content.textContent.trim();
  if (/^https?:\/\//.test(text)) {
    const share = text.match(/app\.arcade\.software\/share\/([A-Za-z0-9_-]+)/);
    return { src: share ? `https://demo.arcade.software/${share[1]}?embed&show_copy_link=true` : text, ratio: "56.25%", extra: "0px" };
  }
  return null;
}

function toShareUrl(src) {
  try {
    const u = new URL(src);
    ["embed", "embed_mobile", "embed_desktop", "show_copy_link"].forEach(k => u.searchParams.delete(k));
    return u.toString();
  } catch (e) { return src; }
}

function esc(t) {
  return String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const list = document.getElementById("demos");

document.querySelectorAll("template.demo-src").forEach((tpl, i) => {
  const title = tpl.dataset.title || `데모 ${i + 1}`;
  const desc = tpl.dataset.desc || "";
  const p = parseEmbed(tpl);
  const id = `demo-${i + 1}`;


  const frame = p
    ? `<div class="frame" style="--ratio:${esc(p.ratio)};--extra:${esc(p.extra)}">
         <iframe src="${esc(p.src)}" title="${esc(title)} 튜토리얼" loading="lazy" allowfullscreen allow="clipboard-write; autoplay; fullscreen"></iframe>
       </div>`
    : `<div class="frame"><div class="empty">이 튜토리얼은 준비 중입니다.</div></div>`;

  list.insertAdjacentHTML("beforeend", `
    <section class="demo" id="${id}">
      <div class="demo-head">
        <span class="no">${i + 1}</span>
        <div>
          <h2>${esc(title)}</h2>
          ${desc ? `<p>${esc(desc)}</p>` : ""}
        </div>
      </div>
      ${frame}
    </section>`);
});
</script>
