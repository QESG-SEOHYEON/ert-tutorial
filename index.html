<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ERT V2 Highlight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14212B;
    --ink-sub: #5A6975;
    --ink-faint: #8A98A3;
    --page: #F4F6F8;
    --card: #FFFFFF;
    --line: #E1E7EB;
    --accent: #2E7491;
    --accent-soft: #E6EEF2;
    --qesg: #2E7491;
    --qesg-deep: #245C73;
    --qesg-deeper: #1A4456;
    --hero-ink: #FFFFFF;
    --hero-sub: #CFE7F1;
    --shadow: 0 1px 2px rgba(16, 33, 43, .04), 0 8px 24px rgba(16, 33, 43, .06);
    --shadow-hover: 0 2px 4px rgba(16, 33, 43, .06), 0 16px 40px rgba(16, 33, 43, .12);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #E7EEF3; --ink-sub: #A0B0BC; --ink-faint: #74858F;
      --page: #0E151B; --card: #16212A; --line: #26333D;
      --accent: #7AAEC4; --accent-soft: #1C303A;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
      --shadow-hover: 0 2px 4px rgba(0,0,0,.35), 0 16px 40px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --ink: #E7EEF3; --ink-sub: #A0B0BC; --ink-faint: #74858F;
    --page: #0E151B; --card: #16212A; --line: #26333D;
    --accent: #7AAEC4; --accent-soft: #1C303A;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    --shadow-hover: 0 2px 4px rgba(0,0,0,.35), 0 16px 40px rgba(0,0,0,.4);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 1rem; line-height: 1.6; -webkit-font-smoothing: antialiased;
    word-break: keep-all; overflow-wrap: break-word;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .wrap { max-width: 1680px; margin: 0 auto; padding: 0 clamp(1rem, 3vw, 3rem); }
  .mono { font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; }

  /* ---------- Hero ---------- */
  .hero {
    position: relative; overflow: hidden;
    background: linear-gradient(135deg, var(--qesg) 0%, var(--qesg-deep) 55%, var(--qesg-deeper) 100%);
    color: var(--hero-ink);
    padding: clamp(2rem, 4vw, 3.25rem) 0 clamp(4.25rem, 7vw, 5.5rem);
  }
  .hero::before {               /* 미세한 격자 패턴 */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 80% 90% at 75% 20%, #000 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 80% 90% at 75% 20%, #000 30%, transparent 75%);
  }
  .hero::after {                /* 우측 상단 포인트 광원 */
    content: ""; position: absolute; width: 640px; height: 640px; right: -180px; top: -260px;
    background: radial-gradient(circle, rgba(255,255,255,.22), transparent 65%);
    pointer-events: none;
  }
  .hero .wrap { position: relative; z-index: 1; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: .625rem;
    font-size: .8125rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase;
    color: var(--hero-sub); margin: 0 0 1rem;
  }
  .eyebrow::before { content: ""; width: 24px; height: 2px; background: #FFFFFF; }
  .hero h1 {
    margin: 0; font-weight: 800; letter-spacing: -.03em; line-height: 1.05;
    font-size: clamp(2rem, 4.8vw, 3.25rem);
  }
  .hero h1 em { font-style: normal; color: #F0F7A0; }
  .hero .lead { margin: .875rem 0 0; max-width: none; color: var(--hero-sub); font-size: clamp(.9375rem, 1.3vw, 1.0625rem); }


  /* ---------- Grid ---------- */
  #demos {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: clamp(1rem, 1.6vw, 1.5rem);
    margin-top: clamp(-3.5rem, -5vw, -2.5rem);   /* 히어로 위로 살짝 겹침 */
    position: relative; z-index: 2;
  }
  /* 주의: 카드에 transform/filter를 쓰면 Arcade 모달(fixed) 확대가 카드 안에 갇히므로 사용하지 않음 */
  .demo {
    display: flex; flex-direction: column;
    background: var(--card); border: 1px solid var(--line); border-radius: 0;
    padding: 1.25rem 1.25rem 1.125rem; box-shadow: var(--shadow);
    transition: box-shadow .25s ease, border-color .25s ease;
  }
  .demo:hover { box-shadow: var(--shadow-hover); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
  .demo-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: .875rem; }
  .demo-no { font-size: .9375rem; font-weight: 500; color: var(--accent); letter-spacing: .02em; }
  .chip {
    font-size: .75rem; font-weight: 500; color: var(--accent);
    background: var(--accent-soft); border-radius: 0; padding: .2rem .625rem;
  }
  .demo h2 { margin: 0 0 .375rem; font-size: 1.0625rem; font-weight: 700; line-height: 1.4; letter-spacing: -.015em; }
  .demo p { margin: 0 0 1rem; color: var(--ink-sub); font-size: .875rem; line-height: 1.6; }

  .frame {
    position: relative; width: 100%; height: 0; margin-top: auto;
    padding-bottom: calc(var(--ratio, 47.4479%) + var(--extra, 41px));
    background: var(--page); border: 1px solid var(--line); border-radius: 0; overflow: hidden;
  }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; color-scheme: light; }
  .frame iframe.is-popout { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 9999999; }
  .empty {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    padding: 2rem; color: var(--ink-faint); font-size: .875rem;
  }


  /* ---------- 탭 ---------- */
  .tabs { display: flex; flex-wrap: wrap; gap: .75rem clamp(1.25rem, 3vw, 2.5rem); margin-top: 1.75rem; border-bottom: 1px solid rgba(255,255,255,.22); }
  .tab {
    position: relative; background: none; border: 0; cursor: pointer;
    padding: 0 0 1rem; color: var(--hero-sub);
    font: inherit; font-size: clamp(1rem, 1.6vw, 1.1875rem); font-weight: 700; letter-spacing: -.01em;
    display: inline-flex; align-items: center; gap: .5rem;
    transition: color .2s ease;
  }
  .tab:hover { color: #fff; }
  .tab[aria-selected="true"] { color: #fff; }
  .tab[aria-selected="true"]::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: #F0F7A0;
  }
  .tab-sub { font-size: .8125em; font-weight: 500; opacity: .85; margin-left: -.125rem; }
  .tab-cnt {
    font-size: .75rem; font-weight: 500; padding: .05rem .45rem;
    border: 1px solid rgba(255,255,255,.35); color: inherit;
  }
  .tab[aria-selected="true"] .tab-cnt { background: #F0F7A0; border-color: #F0F7A0; color: var(--qesg-deeper); }
  .hero .lead[hidden], .panel[hidden] { display: none; }

  /* 연계 앱 카드 */
  #apps-grid {
    margin-top: clamp(-3.5rem, -5vw, -2.5rem); position: relative; z-index: 2;
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(1rem, 1.6vw, 1.5rem); }
  .app { color: var(--ink); }
  .app-head { display: grid; grid-template-columns: auto 1fr auto; gap: .875rem; align-items: center; margin-bottom: .875rem; }
  .app-icon {
    width: 44px; height: 44px; display: grid; place-items: center;
    background: var(--qesg); color: #fff;
  }
  .app-icon svg { width: 24px; height: 24px; }
  .app-head h3 { margin: 0; font-size: 1.125rem; font-weight: 700; letter-spacing: -.015em; line-height: 1.3; }
  .app-head .sub { display: block; font-size: .75rem; color: var(--ink-faint); font-weight: 500; letter-spacing: .03em; margin-top: .1rem; }


  /* 브랜드 */
  .brandbar { display: flex; align-items: center; gap: .75rem; margin: 0 0 1.25rem; }
  .brand-sym { height: 34px; width: auto; display: block; }
  .brand-name { font-weight: 700; font-size: 1rem; letter-spacing: -.005em; color: #fff; }
  .brand-div { width: 1px; height: 14px; background: rgba(255,255,255,.35); }
  .brand-sub { font-size: .8125rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--hero-sub); }
  .foot-logo { height: 38px; width: auto; display: block; }
  footer .wrap { align-items: center; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .foot-logo { filter: brightness(0) invert(.82); } }
  :root[data-theme="dark"] .foot-logo { filter: brightness(0) invert(.82); }

  footer {
    margin-top: clamp(3rem, 6vw, 4.5rem); padding: 1.75rem 0 2.5rem;
    border-top: 1px solid var(--line); color: var(--ink-faint); font-size: .8125rem;
  }
  footer .wrap { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  footer b { color: var(--accent); font-weight: 700; }

  @media (max-width: 1024px) {
    #demos, #apps-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 760px) {
    #demos, #apps-grid { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .demo { transition: none; } }
</style>
</head>

      <p class="lead" data-for="core">ERT V2의 핵심 기능을 인터랙티브 데모로 소개합니다.<br>각 카드를 클릭하면 화면 전체에서 직접 체험할 수 있습니다.</p>

<template class="demo-src" data-group="apps" data-icon="climate" data-title="Climate-Risk App" data-sub="기후 리스크 분석" data-desc="기후 시나리오별 물리적 리스크와 전환 리스크를 분석합니다.">
</template>

<script>
/* Arcade modal(팝아웃) 처리 */
window.addEventListener("message", e => {
  if (e.origin !== "https://demo.arcade.software" || !e.isTrusted || !e.data || !e.data.id) return;
  const f = document.querySelector(`iframe[src*="${CSS.escape(e.data.id)}"]`);
  if (!f || !f.contentWindow) return;
  if (e.data.event === "arcade-init") f.contentWindow.postMessage({ event: "register-popout-handler" }, "*");
  if (e.data.event === "arcade-popout-open") f.classList.add("is-popout");
  if (e.data.event === "arcade-popout-close") f.classList.remove("is-popout");
});

function parseEmbed(tpl) {
  const iframe = tpl.content.querySelector("iframe");
  if (iframe && iframe.getAttribute("src")) {
    const box = (iframe.parentElement && iframe.parentElement.getAttribute("style")) || "";
    const m = box.match(/padding-bottom:\s*calc\(\s*([\d.]+%)\s*\+\s*([\d.]+px)\s*\)/) ||
              box.match(/padding-bottom:\s*([\d.]+%)/);
    return { src: iframe.getAttribute("src"), ratio: m ? m[1] : "56.25%", extra: m && m[2] ? m[2] : "0px" };
  }
  const text = tpl.content.textContent.trim();
  if (/^https?:\/\//.test(text)) {
    const share = text.match(/app\.arcade\.software\/share\/([A-Za-z0-9_-]+)/);
    return { src: share ? `https://demo.arcade.software/${share[1]}?embed&show_copy_link=true` : text, ratio: "56.25%", extra: "0px" };
  }
  return null;
}

function esc(t) {
  return String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const coreGrid = document.getElementById("demos");
const appsGrid = document.getElementById("apps-grid");

const ICONS = {
  ghg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.6-7.96A5.5 5.5 0 0 1 17 8.5a3.75 3.75 0 0 1 .5 7.47"/><path d="M9 21v-5M12 21v-7M15 21v-4"/></svg>',
  tnfd: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14z"/><path d="M5 19l8-8"/></svg>',
  climate: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14.5V5a2 2 0 1 1 4 0v9.5a4 4 0 1 1-4 0z"/><path d="M12 15v-4"/><path d="M17.5 6h3M17.5 10h2"/></svg>'
};

function frameHTML(p, title) {
  return p
    ? `<div class="frame" style="--ratio:${esc(p.ratio)};--extra:${esc(p.extra)}">
         <iframe src="${esc(p.src)}" title="${esc(title)} 데모" loading="lazy" allowfullscreen allow="clipboard-write; autoplay; fullscreen"></iframe>
       </div>`
    : `<div class="frame"><div class="empty">이 데모는 준비 중입니다.</div></div>`;
}

let coreNo = 0;
document.querySelectorAll("template.demo-src").forEach(tpl => {
  const d = tpl.dataset;
  const title = d.title || "데모";
  const desc = d.desc || "";
  const p = parseEmbed(tpl);

  if (d.group === "apps") {
    appsGrid.insertAdjacentHTML("beforeend", `
      <article class="demo app">
        <div class="app-head">
          <span class="app-icon" aria-hidden="true">${ICONS[d.icon] || ICONS.ghg}</span>
          <div><h3>${esc(title)}</h3>${d.sub ? `<span class="sub">${esc(d.sub)}</span>` : ""}</div>
          <span class="chip">연계 앱</span>
        </div>
        ${desc ? `<p>${esc(desc)}</p>` : ""}
        ${frameHTML(p, title)}
      </article>`);
    return;
  }

  coreNo++;
  coreGrid.insertAdjacentHTML("beforeend", `
    <article class="demo">
      <div class="demo-meta">
        <span class="demo-no mono">${String(coreNo).padStart(2, "0")}</span>
        ${d.stage ? `<span class="chip">${esc(d.stage)}</span>` : ""}
      </div>
      <h2>${esc(title)}</h2>
      ${desc ? `<p>${esc(desc)}</p>` : ""}
      ${frameHTML(p, title)}
    </article>`);
});

/* ---------- 탭 ---------- */
document.getElementById("cnt-core").textContent = coreGrid.children.length;
document.getElementById("cnt-apps").textContent = appsGrid.children.length;

function showTab(name) {
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === name)));
  document.getElementById("panel-core").hidden = name !== "core";
  document.getElementById("panel-apps").hidden = name !== "apps";
  document.querySelectorAll(".hero .lead").forEach(l => l.hidden = l.dataset.for !== name);
  try { history.replaceState(null, "", name === "apps" ? "#apps" : location.pathname + location.search); } catch (e) {}
}
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => showTab(t.dataset.tab)));
document.querySelector(".tabs").addEventListener("keydown", e => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const next = document.querySelector('.tab[aria-selected="false"]');
  next.focus(); showTab(next.dataset.tab);
});
let initial = "core";
try { if (location.hash === "#apps") initial = "apps"; } catch (e) {}
showTab(initial);
</script>
